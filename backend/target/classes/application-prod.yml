server:
  port: ${PORT:8080}

spring:
  application:
    name: codeassess-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/codeassess_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect

app:
  jwt:
    secret: ${JWT_SECRET:9a6e8b12f4c78103c81e1f43a9b74052e18d6174a89052b61a3845d01e4a78bc}
    expiration-milliseconds: 86400000
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,https://codeassess-pro.vercel.app}
