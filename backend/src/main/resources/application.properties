# CodeAssess Backend - Production & Environment Configuration
server.port=${PORT:8080}

spring.application.name=codeassess-backend
spring.sql.init.mode=never

# Datasource Configuration (MySQL only)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/codeassess_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Application Security & CORS Settings
app.jwt.secret=${JWT_SECRET:9a6e8b12f4c78103c81e1f43a9b74052e18d6174a89052b61a3845d01e4a78bc}
app.jwt.expiration-milliseconds=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://codeassess-platform.vercel.app,https://codeassess-pro.vercel.app}

# Logging Configuration
logging.level.root=INFO
logging.level.com.codeassess=DEBUG
logging.level.org.springframework.security=INFO
