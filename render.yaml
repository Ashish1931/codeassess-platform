# Render Blueprint for Automated Production Deployment
services:
  - type: web
    name: codeassess-backend
    env: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://codeassess-pro.vercel.app,https://codeassess-platform.vercel.app
